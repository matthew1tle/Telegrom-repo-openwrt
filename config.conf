; OpenWrt Telegram Bot Panel - configuration
; This file is generated by install.sh and re-read on every service (re)start.
; Permissions are forced to 600 by install.sh because bot_token grants full
; control of the bot - never widen these permissions.

[telegram]
bot_token=""
allowed_chat_ids=""
; platform = "telegram" (default) or "bale" - Bale's Bot API mirrors
; Telegram's, so this is the only setting that needs to change to run
; the same bot on Bale instead of (or alongside, with a second install)
; Telegram.
platform="telegram"
; mode = "polling" (default, works everywhere, no public IP needed)
;      = "webhook" (lower resource use, requires a reachable https URL)
mode="polling"
webhook_url=""
webhook_port="8443"

[general]
; Language code. Must match a file name in lang/, e.g. "en" -> lang/en.lua
; To add a new language: drop a lang/<code>.lua file with the same keys as
; lang/en.lua, then set language="<code>" here. Nothing else needs editing.
language="en"

[alerts]
enabled="1"
cpu_percent="90"
mem_percent="90"
disk_percent="90"
temp_celsius="80"
check_interval_sec="60"
wan_check_host="1.1.1.1"

[logging]
max_size_kb="256"
level="info"
